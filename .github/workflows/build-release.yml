name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller fixonce.spec

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\fixonce_setup.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: FixOnce-Windows-Installer
          path: installer/Output/FixOnce_Setup_*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build macOS DMG
        run: bash installer/macos/build_installer.sh

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: FixOnce-mac
          path: installer/macos/build/FixOnce-mac.dmg
